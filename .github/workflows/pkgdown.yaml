# Builds the RELEASE site: https://giotto-suite.github.io/GiottoClass/
#
# The build lives in giotto-suite/.github and is shared across the org. This
# file only says which site this is. Its dev counterpart is pkgdown-dev.yaml,
# which publishes the gsource line to /dev/.
#
# The shared workflow runs pkgdown/pre-build.sh if present. That hook is
# dev-only and returns immediately when SITE_MODE is release -- everything it
# does would corrupt this v0.5.1 build.

name: pkgdown

on:
  push:
    branches: [website]
  pull_request:
    branches: [website]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  site:
    permissions:
      contents: write
    uses: giotto-suite/.github/.github/workflows/pkgdown-site.yaml@main
    with:
      mode: release
      dependencies: '"hard"'
      extra-packages: "any::pkgdown, bioc::BiocStyle, local::."
