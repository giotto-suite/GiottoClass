# Builds the DEVELOPMENT site: https://giotto-suite.github.io/GiottoClass/dev/
#
# The release site documents this `website` branch (the released main line).
# The gsource line adds exports on top -- filterData, reduceData, hnswKNN, the
# *Param classes, the S4 accessors -- documented nowhere else. This publishes
# them without claiming they are released.
#
# WHEN DOES IT REBUILD?
# On a push here, and whenever gsource changes: .github/workflows/
# pkgdown-dev-trigger.yaml on gsource dispatches this workflow. Without that,
# the dev site only moved when this branch did and fell weeks behind gsource.
#
# WHICH REF DOES THIS DOCUMENT?
# package-ref below. This branch owns the website content; the package source
# is checked out at build time. When gsource merges into a default branch and
# is retired, change that one word.
#
# No ref pinning is needed: GiottoClass@gsource's only Remote is a bare
# giotto-suite/GiottoUtils, which resolves to main and satisfies its
# GiottoUtils floor.
#
# The dev-only config surgery lives in pkgdown/pre-build.sh, which the shared
# workflow runs after assembling.

name: pkgdown (dev)

on:
  push:
    branches: [website]
  workflow_dispatch:
    inputs:
      package-ref:
        description: "Branch/tag of giotto-suite/GiottoClass to document"
        default: gsource
        required: false

jobs:
  site:
    permissions:
      contents: write
    uses: giotto-suite/.github/.github/workflows/pkgdown-site.yaml@main
    with:
      mode: dev
      package-repo: giotto-suite/GiottoClass
      package-ref: ${{ inputs.package-ref || 'gsource' }}
      overlay-files: "_pkgdown.yml"
      dependencies: '"hard"'
      # spatial_geometries.Rmd needs these Suggests
      extra-packages: "any::pkgdown, bioc::BiocStyle, any::rprojroot, any::exactextractr, any::sf, any::sp, any::stars, local::."
      # vignettes need GiottoData (Suggests). Pinned without dependencies: its
      # bare giotto-suite/GiottoClass Remote would otherwise replace gsource.
      pins: giotto-suite/GiottoData
      # a floor, not an exact version: gsource bumps its own version often,
      # and an exact match failed the first build after every bump
      expect-versions: "GiottoClass>=0.7.0"
