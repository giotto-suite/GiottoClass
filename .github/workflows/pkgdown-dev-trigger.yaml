# Rebuilds the development site, https://giotto-suite.github.io/GiottoClass/dev/,
# when gsource changes.
#
# The site itself is built by pkgdown-dev.yaml on the `website` branch, which
# checks this branch out. A push there was its only trigger, so the dev site
# fell behind gsource. This dispatches it instead. GITHUB_TOKEN may start a
# workflow_dispatch run, so no extra secret is needed.

name: pkgdown dev trigger

on:
  push:
    branches: [gsource]
    paths:
      - "R/**"
      - "man/**"
      - "vignettes/**"
      - "DESCRIPTION"
      - "NAMESPACE"

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the dev site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pkgdown-dev.yaml --repo "$GITHUB_REPOSITORY" \
            --ref website -f package-ref=gsource
